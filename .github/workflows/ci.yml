name: CI

on:
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential libssl-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The frontend must exist before compiling patchprobe-app (generate_context! reads dist/).
      - name: npm ci
        working-directory: rust/app
        run: npm ci

      - name: npm run build
        working-directory: rust/app
        run: npm run build

      - name: cargo fmt
        working-directory: rust
        run: cargo fmt --all --check

      - name: cargo build
        working-directory: rust
        run: cargo build --workspace --locked

      - name: cargo test
        working-directory: rust
        run: cargo test --workspace --locked

      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
